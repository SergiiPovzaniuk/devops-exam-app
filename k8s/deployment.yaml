apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-exam-app
  labels:
    app: devops-exam-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-exam-app
  template:
    metadata:
      labels:
        app: devops-exam-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: sergejpovzaniuk/devops-exam-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devops-exam-app
  labels:
    app: devops-exam-app
spec:
  type: NodePort
  selector:
    app: devops-exam-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080